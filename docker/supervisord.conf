[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
loglevel = info

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

# Database comes up first. The app retries the connection anyway, it's persistent.
#
# autostart is false when DB_HOST names an outside server. The entrypoint exports
# LOCAL_DB, so the program is defined either way but only runs when this
# container is the one holding the data.
[program:mariadb]
command = /usr/sbin/mariadbd --defaults-file=/etc/mysql/my.cnf
user = mysql
priority = 10
autostart = %(ENV_LOCAL_DB)s
autorestart = true
startsecs = 5
stopsignal = TERM
stopwaitsecs = 40
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0

[program:npmrepo]
command = /usr/local/bin/node /opt/npmrepo/src/index.js
directory = /opt/npmrepo
#not root. it can read its code and the database credentials, write its cache,
#and that's it for the whole box
user = forgerepo
priority = 20
autostart = true
autorestart = true
startsecs = 5
# the database may still be waking up on a cold boot, give it a minute
startretries = 15
stopsignal = TERM
stopwaitsecs = 20
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
environment = NODE_ENV="production"
