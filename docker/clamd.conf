# clamd for ForgeRepo. the image's own settings, plus limits big enough for container image layers and large wheels.
# clamd's defaults stop at 100 MB, and a file it will not take is a file ForgeRepo will not serve while
# "Scan before serving" is on. 4000M is as high as clamd goes
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

StreamMaxLength 4000M
MaxScanSize 4000M
MaxFileSize 4000M
